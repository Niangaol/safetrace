# ==========================================================================
# SafeTrace · MG1 模型清单（ModelProfile）
# 红线：业务代码只认 role 名，禁止 import provider SDK；切 provider 只改本文件
# provider 枚举：cache（离线确定性）| openai_compat（DeepSeek/GLM/vLLM/Ollama 通用）
# ==========================================================================
version: 1

providers:
  tokendance:
    type: openai_compat
    base_url_env: TOKENDANCE_BASE_URL
    base_url_default: https://tokendance.space/gateway/v1
    api_key_env: TOKENDANCE_API_KEY

  # ---- 本地 llama-server（无 Docker，scripts/local/up.ps1 一键起）----
  # trust_boundary: local → A-03 隔离闸门放行：本地是私有数据合法目的地，不过出网扫描
  local_embed:
    type: openai_compat
    base_url_env: LOCAL_EMBED_BASE_URL
    base_url_default: http://127.0.0.1:8081/v1
    api_key_env: LOCAL_EMBED_API_KEY
    trust_boundary: local
    capability_flags: { rerank: false }

  local_llm:
    type: openai_compat
    base_url_env: LOCAL_LLM_BASE_URL
    base_url_default: http://127.0.0.1:8080/v1
    api_key_env: LOCAL_LLM_API_KEY
    trust_boundary: local
    capability_flags: { rerank: false }
  cache:
    type: cache            # 确定性假模型：演示与离线开发用，输出可复现
  deepseek:
    type: openai_compat
    base_url_env: DEEPSEEK_BASE_URL
    base_url_default: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
  glm:
    type: openai_compat
    base_url_env: GLM_BASE_URL
    base_url_default: https://open.bigmodel.cn/api/paas/v4
    api_key_env: GLM_API_KEY
  vllm:
    type: openai_compat
    base_url_env: VLLM_BASE_URL
    base_url_default: http://127.0.0.1:8000/v1
    api_key_env: VLLM_API_KEY
  ollama:
    type: openai_compat
    base_url_env: OLLAMA_BASE_URL
    base_url_default: http://127.0.0.1:11434/v1
    api_key_env: OLLAMA_API_KEY
    capability_flags: { rerank: false }   # Ollama 无 rerank 端点，禁静默降级为 chat

# 默认降级链（云端 → 本地 → 缓存 → 模板），每次降级必须显式留痕
default_fallback_chain: [deepseek, vllm, cache, template]

roles:
  planner:
    provider: cache
    model_id: cache-planner
    model_version: v0
    max_rpm: 600
    max_tpm: 2000000
    max_concurrency: 4
    timeout_ms: 30000
    fallback_chain: [cache, template]
    capability_flags: { tools: false }

  answerer:
    provider: cache
    model_id: cache-answerer
    model_version: v0
    max_rpm: 600
    max_tpm: 2000000
    max_concurrency: 4
    timeout_ms: 30000
    fallback_chain: [cache, template]
    # 真实模型接入时改为：provider: deepseek, model_id: deepseek-chat

  # 本地 bge-m3（llama-server :8081）：实测 1024 维，与 Tokendance qwen3.7-text-embedding
  # 同维度，故 safetrace_sources 集合向量元数据可直接复用，无需重建。
  # 要切回云端：provider 改 tokendance、model_id 改 qwen3.7-text-embedding、
  # model_version 改 unversioned-api（该行不留 revision，不宣称版本已固定）。
  embedder:
    provider: local_embed
    model_id: bge-m3
    model_version: gguf-q8_0
    # data_domain 必须是 public，否则 A-03 隔离闸门会拦掉下面 fallback_chain 里的
    # 云端 Tokendance，"本地没模型就转云端"这条路直接失效。公开漏洞情报（CVE/USN/KEV）
    # 本身可出网，原云端配置亦为 public，与此一致。
    # 若将来要处理含内网标识的私有证据，必须改回 private 并同时把 fallback_chain 去掉云端。
    data_domain: public
    max_rpm: 600
    max_concurrency: 4
    timeout_ms: 30000
    # 本地模型未就绪（用户拒绝下载/下载失败/SAFETRACE_SKIP_MODEL_DOWNLOAD=true）时
    # 显式回退云端 Tokendance，再退 cache。降级全程登记 FallbackEvent + degraded_to，
    # 不是静默兜底。要彻底禁云：把这一行改成 [cache]，同时 data_domain 可改回 private。
    fallback_chain: [tokendance, cache]
    # 关键：降级到真实 provider 时必须给它真实存在的模型名。
    # 不配这项，MG1 会拿 "tokendance-fallback" 当模型名发出去，被云端 400 拒，
    # 于是"转云端"形同虚设（2026-09-30 实测踩到并修复）。
    fallback_model_ids: { tokendance: qwen3.7-text-embedding }
    capability_flags: { dim: 1024 }

  reranker:
    provider: cache
    model_id: cache-reranker
    model_version: v0
    max_rpm: 600
    max_concurrency: 4
    timeout_ms: 20000
    fallback_chain: [cache]

  decision:                 # D4：Y5分级/Q1路由/Q3充分性 的结构化判断
    provider: cache
    model_id: rule-fallback-v0   # P0 为规则通道；Jev 通道留 decided_by 枚举位
    model_version: v0
    max_rpm: 1200
    max_concurrency: 8
    timeout_ms: 10000
    fallback_chain: [cache]
