name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"
      - name: Ruff 检查
        run: ruff check .
      - name: Ruff 格式校验
        run: ruff format --check .
      - name: 类型检查
        run: mypy src
      - name: 单元测试（无需外部服务）
        run: pytest -q --no-cov
      - name: 真实启动冒烟（lifespan / SSE）
        run: pytest -q --no-cov tests/test_live_server.py

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        working-directory: web
        run: npm ci
      - name: 类型检查并构建
        working-directory: web
        run: npm run build

  build-image:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: 构建 API 镜像
        run: docker build -f deploy/Dockerfile -t ai-threat-intel:${{ github.sha }} .
