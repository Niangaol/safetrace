name: ai-threat-intel

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: intel
      POSTGRES_PASSWORD: intel
      POSTGRES_DB: intel
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intel"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollamadata:/root/.ollama
    # 首次启动后执行：docker compose exec ollama ollama pull qwen2.5:7b-instruct
    # 本地嵌入模型（bge-m3）可挂到 ollama，也可由 api 服务用 sentence-transformers 加载

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        # 嵌入依赖默认不装（torch 约 2.5GB，且本机 HF 不可达、装了也用不上）。
        # 需要语义检索：INSTALL_EMBED=1 docker compose build api
        INSTALL_EMBED: "${INSTALL_EMBED:-}"
    env_file: [.env]
    environment:
      POSTGRES_DSN: postgresql+psycopg://intel:intel@postgres:5432/intel
      REDIS_URL: redis://redis:6379/0
      LLM_LOCAL_BASE_URL: http://ollama:11434
      # ⚠️ 实测：本机网络下 huggingface.co **不可达**（容器里连它、ollama registry、
      # hf-mirror 全部失败；能通的是 PyPI / npm 镜像 / ModelScope）。
      # 不限制的话 SentenceTransformer 首次加载会重试到超时，实测单次问答卡 3.5 分钟。
      # 这两个是 HF 官方支持的调优变量，把单次尝试压到秒级，
      # 配合 embedder 的失败熔断一起用（见 services/knowledge/embedder.py）。
      HF_HUB_DOWNLOAD_TIMEOUT: "15"
      HF_HUB_ETAG_TIMEOUT: "10"
      # 若要启用语义检索：在有网的环境先跑一次把 bge-m3 拉进下面的 hfcache 卷，
      # 之后本 compose 可直接离线加载（卷挂在 /root/.cache/huggingface）。
    ports: ["8000:8000"]
    volumes:
      # ⚠️ 必须给 HF 缓存挂卷：api 镜像里装了 sentence-transformers，
      # 首次加载 bge-m3 会下载约 2.2GB 权重。不挂卷的话每次重建容器都要重下，
      # 演示前那一轮会卡很久（且外网不稳时直接失败）。
      - hfcache:/root/.cache/huggingface
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn aiintel.api.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # npm registry 覆盖：**默认留空 = 用官方源**（可移植）。
        # 在本机实测过：容器连不上 registry.npmjs.org（`npm error network`，
        # 782s 超时），此时设 NPM_REGISTRY 用可达的镜像即可：
        #   NPM_REGISTRY=https://registry.npmmirror.com docker compose build web
        # 不在仓库里写死某个镜像 —— 能直连的环境用它反而更慢。
        NPM_REGISTRY: "${NPM_REGISTRY:-}"
    ports: ["5173:80"]
    depends_on: [api]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["9090:9090"]
    depends_on: [api]

volumes:
  pgdata:
  ollamadata:
  hfcache:
